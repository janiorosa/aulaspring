spring.application.name=backend
server.port=8088

# Conexão com PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/aula
spring.datasource.username=aula
spring.datasource.password=aula

spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Não deixar o Hibernate tentar criar o schema
spring.jpa.properties.hibernate.default_schema=controlemerc

